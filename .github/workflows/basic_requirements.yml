name: List Files and Disk Usage

on:
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  check-disk-usage:
    runs-on: ubuntu-latest

    steps:
    - name: Check total disk space usage
      run: df -h

    - name: List all files and their sizes (sorted by size)
      run: |
        echo "Listing all files and their sizes..."
        sudo du -ah / | sort -rh | head -n 50  # Shows the top 50 largest files

    - name: Save disk usage report to a file
      run: |
        sudo du -ah / | sort -rh > disk_usage_report.txt
        echo "Disk usage report saved as disk_usage_report.txt"

    - name: Upload disk usage report as an artifact
      uses: actions/upload-artifact@v3
      with:
        name: disk-usage-report
        path: disk_usage_report.txt
